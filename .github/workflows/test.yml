name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-and-integration:
    name: Type-check, unit + integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit + integration tests (Jest)
        run: npm test -- --ci

      - name: Build
        run: npm run build
