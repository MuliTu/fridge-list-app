name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-and-integration:
    name: Type-check, unit + integration tests, build
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: public-ci-placeholder
      VITE_FIREBASE_API_KEY: public-ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: public-ci-placeholder.firebaseapp.com
      VITE_FIREBASE_DATABASE_URL: https://public-ci-placeholder-default-rtdb.europe-west1.firebasedatabase.app
      VITE_FIREBASE_PROJECT_ID: public-ci-placeholder
      VITE_FIREBASE_APP_ID: public-ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test architecture boundary failures
        run: npm run test:architecture

      - name: Check module dependency boundaries
        run: npm run architecture:check

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit + integration tests (Jest)
        run: npm test -- --ci

      - name: Build
        run: npm run build
