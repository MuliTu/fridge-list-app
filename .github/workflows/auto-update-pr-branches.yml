name: Auto-update PR branches

# Whenever main changes, merge it into every open PR branch automatically — the
# manual equivalent of clicking GitHub's "Update branch" button on each open PR.
# Uses the REST API's update-branch endpoint, which performs a real merge commit
# and simply fails for a given PR if that merge would conflict.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-open-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Update every open PR branch with main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --state open --json number --jq '.[].number'); do
            echo "Updating PR #$pr with latest main..."
            gh api -X PUT "repos/${{ github.repository }}/pulls/$pr/update-branch" \
              && echo "PR #$pr updated" \
              || echo "PR #$pr could not be auto-updated (likely a merge conflict) — needs manual attention"
          done
