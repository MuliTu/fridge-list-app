name: E2E (post-deploy)

# This project is connected to Vercel via its native GitHub integration (confirmed:
# the git-branch-aliased domain fridge-list-app-git-main-*.vercel.app only exists for
# git-linked projects) — Vercel's GitHub App creates a Deployment for every push and
# fires `deployment_status` once it finishes, for both preview and production
# deployments. Running here, not on `push`, means these e2e tests hit the actual
# deployed app (real Firebase, real routing, real build output) instead of a
# freshly-checked-out dev server — a meaningfully different, complementary check to
# the unit/integration suite in test.yml.
#
# Only runs for Production deployments, against the fixed custom domain
# (fridge-list-app.vercel.app), not the deployment_status payload's own
# environment_url/target_url. Confirmed the hard way (every run failed identically
# until this was root-caused): that per-deployment URL is behind Vercel's Deployment
# Protection auth wall for BOTH preview and production targets — a plain curl against
# it 302-redirects to Vercel's login page, while the stable production domain is
# genuinely public (confirmed separately, matching this app's own "viewing never
# requires auth" design in CLAUDE.md). Preview deployments have no equivalent public
# URL, so they're skipped here rather than producing another guaranteed-red check —
# giving them real e2e coverage would need Vercel's "Protection Bypass for
# Automation" secret wired in as a GitHub Actions secret, not set up yet.
on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    name: Playwright e2e against production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests against production
        env:
          E2E_BASE_URL: https://fridge-list-app.vercel.app
        run: npm run test:e2e
