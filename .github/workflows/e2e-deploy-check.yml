name: E2E (post-deploy)

# Vercel's GitHub integration creates a Deployment for every push and emits
# `deployment_status` after each deployment. Running here means these e2e tests hit
# the actual deployed app instead of a freshly checked-out dev server.
#
# Only runs for Production deployments, against the fixed custom domain
# (fridge-list-app.vercel.app), not the deployment_status payload's own
# environment_url/target_url. Preview deployments may be protected, while the stable
# production domain is public and matches the app's view-only access model.
on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    name: Playwright e2e against production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests against production
        env:
          E2E_BASE_URL: https://fridge-list-app.vercel.app
        run: npm run test:e2e
